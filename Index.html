<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Planeador Perú 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a hero with a woven band, a "cordillera" of eight peaks (one per day, height = altitude), then the selected day's checklist. */
:root{
  --bg:#FAF7FF; --surface:#FFFFFF; --surface2:#F1ECFA; --ink:#20153A; --muted:#675B83; --line:#E2D9F2; --mix:#000;
  --d1:#C2187F; --d2:#00857F; --d3:#F2A900; --d4:#6E3FCB; --d5:#1E8449; --d6:#1575C9; --d7:#D6401A; --d8:#D42A45;
  --ok:#1E8449; --warn:#B36B00;
  --font-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#130F24; --surface:#1E1836; --surface2:#2A2149; --ink:#F5F0FF; --muted:#B5A9D3; --line:#3B3064; --mix:#fff;
  --ok:#5BD08A; --warn:#FFC35A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#130F24; --surface:#1E1836; --surface2:#2A2149; --ink:#F5F0FF; --muted:#B5A9D3; --line:#3B3064; --mix:#fff;
  --ok:#5BD08A; --warn:#FFC35A; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--d4);outline-offset:2px}
:root[data-theme="dark"] :focus-visible{outline-color:#C9B3FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) :focus-visible{outline-color:#C9B3FF}}

.d1{--c:var(--d1);--on:#fff}.d2{--c:var(--d2);--on:#fff}.d3{--c:var(--d3);--on:#2A1B00}.d4{--c:var(--d4);--on:#fff}
.d5{--c:var(--d5);--on:#fff}.d6{--c:var(--d6);--on:#fff}.d7{--c:var(--d7);--on:#fff}.d8{--c:var(--d8);--on:#fff}
.ctext{color:color-mix(in srgb,var(--c) 78%,var(--mix))}
.tint{background:color-mix(in srgb,var(--c) 11%,var(--surface))}

/* hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden}
.band{display:block;width:100%;height:40px}
.hero-in{padding:20px clamp(18px,4vw,36px) 24px;display:flex;flex-direction:column;gap:22px}
.scene{position:relative;isolation:isolate;overflow:hidden;color:#fff;min-height:340px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding:26px clamp(18px,4vw,36px) 26px}
.scene svg.bg{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.scene::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(18,8,48,.62),rgba(18,8,48,.2) 65%,rgba(18,8,48,.05)),linear-gradient(0deg,rgba(18,8,48,.45),rgba(18,8,48,0) 55%)}
@media (max-width:640px){.scene::after{background:linear-gradient(0deg,rgba(18,8,48,.7),rgba(18,8,48,.3))}}
.scene .kicker,.scene .who{color:rgba(255,255,255,.9)}
.scene h1{text-shadow:0 2px 24px rgba(18,8,48,.5)}
.scene h1 span:nth-child(1){color:#FF6FC0}.scene h1 span:nth-child(2){color:#3EE0D0}.scene h1 span:nth-child(3){color:#B9A0FF}.scene h1 span:nth-child(4){color:#FFA25C}
.scene h1 .yr{color:transparent;-webkit-text-stroke:2.5px #fff}
.scene .route i{border-top-color:rgba(255,255,255,.7)}
.clouds{animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(40px)}}
.kicker{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:4px 0 0;font-family:var(--font-display);font-weight:800;font-size:clamp(56px,14vw,112px);line-height:.92;letter-spacing:-.02em;text-wrap:balance}
h1 span:nth-child(1){color:var(--d1)}h1 span:nth-child(2){color:var(--d2)}h1 span:nth-child(3){color:var(--d4)}h1 span:nth-child(4){color:var(--d6)}
h1 .yr{color:transparent;-webkit-text-stroke:2.5px var(--ink);margin-left:.12em}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;font-weight:600}
.route .stop{padding:4px 12px;border-radius:99px;background:var(--c);color:var(--on);font-size:13px;font-weight:700}
.route i{width:22px;height:0;border-top:3px dotted var(--muted)}
.who{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--c) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line))}
.stat b{font-family:var(--font-display);font-size:34px;line-height:1;font-weight:800}
.stat small{display:block;color:var(--muted);font-size:13px;line-height:1.3;font-weight:500}
.stat .lbl{font-weight:700;font-size:14px;color:var(--ink);display:block}
.ring{width:62px;height:62px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .tr{stroke:color-mix(in srgb,var(--c) 20%,var(--surface2))}
.ring .fg{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:14px;font-family:var(--font-display)}

/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 18px;font-weight:700;font-size:14px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .n{display:inline-block;min-width:22px;margin-left:6px;padding:0 6px;border-radius:99px;background:var(--d3);color:#2A1B00;font-size:12px;text-align:center}
.sync{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}
.sync.cloud::before{background:var(--ok)}

/* cordillera */
.cord{display:flex;align-items:flex-end;gap:6px;overflow-x:auto;padding:10px 2px 18px;scroll-snap-type:x proximity}
.peak{flex:1 0 98px;scroll-snap-align:center;position:relative;border:0;background:none;padding:0;opacity:.62;transition:opacity .2s,transform .2s}
.peak:hover,.peak[aria-pressed="true"]{opacity:1}
.peak[aria-pressed="true"]{transform:translateY(-4px)}
.peak .shape{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:1px;text-align:center;
  padding:0 8px 10px;background:var(--c);color:var(--on);clip-path:polygon(0 100%,0 40%,50% 0,100% 40%,100% 100%)}
.peak .pn{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1}
.peak .pd{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.9}
.peak .pl{font-size:12px;line-height:1.2;font-weight:600;min-height:29px;display:flex;align-items:center}
.peak .pb{width:100%;height:5px;border-radius:9px;background:rgba(255,255,255,.35);overflow:hidden;margin-top:3px}
.d3 .peak .pb,.peak.d3 .pb{background:rgba(0,0,0,.18)}
.peak .pb i{display:block;height:100%;background:var(--on);border-radius:9px;transition:width .4s}
.peak[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:-13px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--c);border-bottom:0}
.peak .hoy{position:absolute;top:30%;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:10px;font-weight:800;letter-spacing:.08em;padding:1px 7px;border-radius:99px;text-transform:uppercase}
.peak .full{position:absolute;top:38%;right:14%;width:20px;height:20px;border-radius:50%;background:var(--on);color:var(--c);display:grid;place-items:center;font-size:12px;font-weight:800}

/* day panel */
.panel{display:flex;flex-direction:column;gap:16px}
.dhead{position:relative;overflow:hidden;border-radius:26px;background:var(--c);color:var(--on);padding:26px clamp(18px,4vw,34px) 30px;display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.dhead::after{content:"";position:absolute;right:-30px;bottom:0;width:min(60%,380px);height:78%;background:rgba(255,255,255,.16);clip-path:polygon(0 100%,38% 18%,52% 44%,70% 0,100% 100%);pointer-events:none}
.d3 .dhead::after{background:rgba(0,0,0,.1)}
.d7 .dhead::before{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(90deg,#E53935,#FB8C00,#FDD835,#43A047,#1E88E5,#5E35B1,#D81B60)}
.dnum{font-family:var(--font-display);font-weight:800;font-size:clamp(80px,16vw,128px);line-height:.8;color:transparent;-webkit-text-stroke:3px var(--on);position:relative}
.dtxt{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 260px}
.dtxt .when{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.92}
.dtxt h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(26px,5vw,40px);line-height:1.05;text-wrap:balance}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.22)}
.d3 .chip{background:rgba(0,0,0,.12)}
.dprog{position:relative;flex:0 0 150px;display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:13px}
.dprog .bar{height:10px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}
.d3 .dprog .bar{background:rgba(0,0,0,.15)}
.dprog .bar i{display:block;height:100%;background:var(--on);border-radius:99px;transition:width .4s}

.note{border-radius:18px;padding:14px 18px;background:color-mix(in srgb,var(--c) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 32%,var(--line))}
.note b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec h3{margin:0;font-family:var(--font-display);font-size:20px;font-weight:700;display:flex;align-items:baseline;gap:10px}
.sec h3 small{font-family:var(--font-body);font-size:13px;color:var(--muted);font-weight:600}

.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:background .2s,border-color .2s}
.row:hover{border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
.row.done{background:color-mix(in srgb,var(--c) 13%,var(--surface));border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.row .time{flex:none;width:54px;font-family:var(--font-display);font-weight:700;font-size:15px;padding-top:1px;font-variant-numeric:tabular-nums}
.row .body{flex:1;min-width:0}
.row .tt{font-weight:600;overflow-wrap:anywhere}
.row .dd{font-size:13.5px;color:var(--muted);margin-top:1px}
.row.done .tt{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:color-mix(in srgb,var(--c) 70%,var(--surface));color:var(--muted)}
.row .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:11.5px;font-weight:700;border-radius:99px;padding:1px 9px;border:1.5px solid color-mix(in srgb,var(--c) 55%,var(--line));color:color-mix(in srgb,var(--c) 75%,var(--mix))}
.tag.fill{background:var(--c);border-color:var(--c);color:var(--on)}
.tag.opt{border-style:dashed}
.task{border-style:dashed;border-width:2px}
.task.done{border-style:solid}
.pill{flex:none;align-self:center;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:3px 10px;border:2px solid var(--warn);color:var(--warn)}
.task.done .pill{background:var(--ok);border-color:var(--ok);color:var(--bg)}

input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin:0;border-radius:9px;border:2.5px solid var(--c);background:var(--surface);position:relative;cursor:pointer;transition:background .15s}
input[type=checkbox]:checked{background:var(--c)}
input[type=checkbox]:checked::after{content:"";position:absolute;left:7px;top:2px;width:7px;height:13px;border:solid var(--on);border-width:0 3px 3px 0;transform:rotate(45deg)}
.pop input[type=checkbox]{animation:pop .35s}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

textarea{width:100%;min-height:96px;resize:vertical;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:12px 14px}
textarea:focus-visible{border-color:var(--c);outline:none}
.navrow{display:flex;justify-content:space-between;gap:10px}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 18px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.solid{background:var(--c);border-color:var(--c);color:var(--on)}
.btn:disabled{opacity:.35;cursor:default}

/* pendientes */
.cat{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:24px;background:color-mix(in srgb,var(--c) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 28%,var(--line))}
.cat h3{margin:0;font-family:var(--font-display);font-size:21px;display:flex;align-items:center;gap:10px}
.cat h3 .dot{width:14px;height:14px;border-radius:50%;background:var(--c)}
.cat h3 small{margin-left:auto;font-family:var(--font-body);font-size:13px;color:var(--muted);font-weight:700}
.tasks-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.daytag{font-size:11.5px;font-weight:800;border-radius:99px;padding:1px 9px;background:var(--dc);color:var(--don)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{color:var(--muted);font-size:14px}

/* boarding passes */
.passes{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.pass{display:grid;grid-template-columns:minmax(0,1fr) 150px;border-radius:22px;background:var(--surface);border:1px solid var(--line);position:relative}
.pass.todo{border:2px dashed var(--c)}
.pass .main{padding:0 0 14px;min-width:0;border-radius:22px 0 0 22px;overflow:hidden}
.pass .top{background:var(--c);color:var(--on);padding:10px 16px;display:flex;justify-content:space-between;gap:10px;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.pass .legs{padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.leg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.leg b{display:block;font-family:var(--font-display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.leg small{color:var(--muted);font-size:12.5px;font-weight:600}
.leg .mid{text-align:center;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.05em}
.leg .mid hr{border:0;border-top:3px dotted var(--c);margin:5px 0 0}
.leg .r{text-align:right}
.layover{font-size:12.5px;color:var(--muted);font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface2);align-self:flex-start}
.pass .foot{padding:10px 16px 0;font-size:12.5px;color:var(--muted)}
.pass .stub{border-left:2.5px dashed var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:10px;justify-content:center;align-items:center;text-align:center;position:relative}
.pass .stub::before,.pass .stub::after{content:"";position:absolute;left:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.pass .stub::before{top:-11px;clip-path:inset(50% 0 0 0)}
.pass .stub::after{bottom:-11px;clip-path:inset(0 0 50% 0)}
.stub .who{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.code{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:.06em;border:0;background:none;padding:2px 8px;border-radius:10px;color:color-mix(in srgb,var(--c) 78%,var(--mix))}
.code:hover{background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.stub .cp{font-size:11px;color:var(--muted)}
@media (max-width:520px){
  .pass{grid-template-columns:minmax(0,1fr)}
  .pass .main{border-radius:22px 22px 0 0}
  .pass .stub{border-left:0;border-top:2.5px dashed var(--line);flex-direction:row;flex-wrap:wrap;gap:6px 18px}
  .pass .stub::before,.pass .stub::after{display:none}
}

/* hotels and tours */
.sh{margin:6px 0 0;font-family:var(--font-display);font-size:24px;font-weight:800}
.blk{display:flex;flex-direction:column;gap:14px}
.info{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.card{border-radius:22px;background:var(--surface);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .ctop{background:var(--c);color:var(--on);padding:10px 16px;display:flex;justify-content:space-between;gap:10px;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.card .cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.card h4{margin:0;font-family:var(--font-display);font-size:19px;line-height:1.2;font-weight:700}
.card .sub{color:var(--muted);font-size:13.5px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 14px}
.kv div{min-width:0}
.kv small{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kv span{font-weight:600;overflow-wrap:anywhere}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.lists h5{margin:0 0 4px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.lists ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.lists li{padding-left:18px;position:relative}
.lists li::before{content:"";position:absolute;left:2px;top:.5em;width:8px;height:8px;border-radius:50%;background:var(--c)}
.lists .no li::before{background:none;border:2px solid var(--muted)}
.callout{font-size:13.5px;border-radius:12px;padding:8px 12px;background:color-mix(in srgb,var(--d3) 22%,var(--surface))}
.codeline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.codeline small{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.foot2{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.reset{border:0;background:none;text-decoration:underline;color:var(--muted);font-size:13px;padding:4px}
.confirm{display:flex;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:30;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* persistence */
var doc=null,timer=null,writing=false,again=false,migrated=false;
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(!doc)return;clearTimeout(timer);timer=setTimeout(flush,450);
}
function flush(){
  timer=null;if(!doc)return;
  if(writing){again=true;return}
  writing=true;
  doc.set({v:1,done:S.done,notes:S.notes,seed:S.seed}).then(function(){setSync("cloud")},function(){setSync("local")}).then(function(){
    writing=false;if(again){again=false;flush()}});
}
function setSync(v){if(sync!==v){sync=v;renderTabs()}}
function initDb(){
  if(!window.claude||!window.claude.use)return;
  window.claude.use("db").then(function(db){
    if(!db)return;
    doc=db.doc("trip/progress");
    doc.onSnapshot(function(snap){
      if(timer||writing)return;
      if(!snap.exists){
        if(!migrated){migrated=true;flush()}
        return;
      }
      var d=snap.data()||{},ns={done:d.done||{},notes:d.notes||{},seed:d.seed||0};
      setSync("cloud");
      var old=JSON.stringify(S);S=ns;var seeded=applySeed();
      if(JSON.stringify(S)!==old){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}renderAll()}
      if(seeded)persist();
    },function(){});
  }).catch(function(){});
}

  '<div class="scene">'+sceneSvg()+'<div><div class="kicker">Vacaciones · 19 al 26 de noviembre</div>'+

  '<div class="route" aria-label="Ruta"><span class="stop d1">Cali</span><i></i><span class="stop d2">Lima</span><i></i><span class="stop d4">Cusco</span><i></i><span class="stop d7">Lima</span><i></i><span class="stop d8">Cali</span></div>'+
  '<div class="who">Jairo y Lorena</div></div>'+
  '<div class="hero-in"><div class="stats">'+
   '<div class="stat d7"><b class="ctext">'+n+'</b><small>'+l+'</small></div>'+
   '<div class="stat d2">'+ring("d2",T.ak,T.at)+'<div><span class="lbl">Actividades</span><small>'+T.ak+' de '+T.at+' realizadas</small></div></div>'+
   '<div class="stat d3">'+ring("d3",T.tk,T.tt)+'<div><span class="lbl">Pendientes</span><small>'+T.tk+' de '+T.tt+' resueltos</small></div></div>'+
  '</div></div>';
}

/* tabs */
function renderTabs(){
  var left=TASKS.length-totals().tk;
  var items=[["itin","Itinerario"],["pend","Pendientes"],["vue","Vuelos y reservas"]];
  $("tabs").innerHTML=items.map(function(it){
    return '<button class="tab" role="tab" data-tab="'+it[0]+'" aria-selected="'+(tab===it[0])+'">'+it[1]+(it[0]==="pend"&&left?'<span class="n">'+left+'</span>':'')+'</button>';
  }).join("")+'<span class="sync '+(sync==="cloud"?"cloud":"")+'">'+(sync==="cloud"?"Sincronizado":"Guardado en este dispositivo")+'</span>';
}

/* itinerary */
function cord(){
  var ti=tripDayIndex();
  return '<div class="cord" id="cord" role="group" aria-label="Días del viaje">'+DAYS.map(function(d,i){
    var s=actStats(d),h=Math.round(128+d.alt/5200*118);
    return '<button class="peak d'+d.n+'" data-day="'+i+'" aria-pressed="'+(i===cur)+'" aria-label="Día '+d.n+', '+esc(d.short)+', '+s.k+' de '+s.t+' actividades">'+
      '<div class="shape" style="height:'+h+'px">'+
      (i===ti?'<span class="hoy">Hoy</span>':'')+(s.t&&s.k===s.t?'<span class="full">✓</span>':'')+
      '<span class="pd">'+d.date+'</span><span class="pn">'+d.n+'</span><span class="pl">'+esc(d.short)+'</span>'+
      '<span class="pb"><i style="width:'+Math.round(s.p*100)+'%"></i></span></div></button>';
  }).join("")+'</div>';
}
function actRow(d,a,hasT){
  var on=!!S.done[a.id];
  return '<label class="row '+(on?"done":"")+(justToggled===a.id?" pop":"")+'">'+
   '<input type="checkbox" data-id="'+a.id+'" '+(on?"checked":"")+'>'+
   (hasT?'<span class="time">'+(a.t||"·")+'</span>':'')+
   '<span class="body"><div class="tt">'+esc(a.h)+'</div>'+(a.d?'<div class="dd">'+esc(a.d)+'</div>':'')+
   ((a.f||a.o)?'<div class="tags">'+(a.f?'<span class="tag fill">'+a.f+'</span>':'')+(a.o?'<span class="tag opt">Opcional</span>':'')+'</div>':'')+
   '</span></label>';
}
function taskRow(t,showDay){
  var on=!!S.done[t.id],dd=DAYS[t.day-1];
  return '<label class="row task '+(on?"done":"")+(justToggled===t.id?" pop":"")+' d'+t.day+'">'+
   '<input type="checkbox" data-id="'+t.id+'" '+(on?"checked":"")+'>'+
   '<span class="body"><div class="tt">'+esc(t.h)+'</div>'+(t.d?'<div class="dd">'+esc(t.d)+'</div>':'')+
   ((t.p||showDay)?'<div class="tags">'+(t.p?'<span class="tag fill" style="--c:var(--d7)">Prioritario</span>':'')+
   (showDay?'<span class="daytag" style="--dc:var(--d'+t.day+');--don:'+(t.day===3?"#2A1B00":"#fff")+'">Día '+t.day+' · '+dd.date+'</span>':'')+'</div>':'')+
   '</span><span class="pill">'+(on?"Listo":"Pendiente")+'</span></label>';
}
function stayCard(h){
  return '<article class="card d'+h.c+'"><div class="ctop"><span>Reservado · '+esc(h.nights)+'</span><span>'+esc(h.city)+'</span></div><div class="cbody">'+
   '<h4>'+esc(h.name)+'</h4>'+
   '<div class="kv"><div><small>Llegada</small><span>'+esc(h.inn)+'</span></div><div><small>Salida</small><span>'+esc(h.out)+'</span></div>'+
   '<div><small>Viajeros</small><span>2 viajeros</span></div><div><small>Anfitrión</small><span>'+esc(h.host)+'</span></div></div>'+
   '<div class="sub">'+esc(h.addr)+'</div>'+(h.late?'<div class="callout">'+esc(h.late)+'</div>':'')+
   '<div class="codeline"><small>Confirmación</small>'+code(h.code)+'</div></div></article>';
}
function tourCard(t){
  function li(a){return a.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")}
  return '<article class="card d'+t.c+'"><div class="ctop"><span>Tour comprado · '+esc(t.diff)+'</span><span>'+esc(t.hor)+'</span></div><div class="cbody">'+
   '<h4>'+esc(t.name)+'</h4>'+
   '<div class="kv"><div><small>Precio</small><span>'+esc(t.price)+'</span></div>'+
   (t.alt?'<div><small>Altura</small><span>'+esc(t.alt)+'</span></div>':'')+
   (t.walk?'<div><small>Caminata</small><span>'+esc(t.walk)+'</span></div>':'')+
   '<div><small>Recorrido</small><span>'+esc(t.extra)+'</span></div></div>'+
   '<div class="sub"><b>Recojo:</b> '+esc(t.pick)+'</div>'+
   '<div class="lists"><div><h5 class="ctext">Incluye</h5><ul>'+li(t.inc)+'</ul></div><div class="no"><h5>No incluye</h5><ul>'+li(t.exc)+'</ul></div></div></div></article>';
}
function dayInfo(n){
  var a=HOTELS.filter(function(h){return h.day===n}).map(stayCard).concat(TOURS.filter(function(t){return t.day===n}).map(tourCard));
  return a.length?'<div class="info">'+a.join("")+'</div>':'';
}
function dayPanel(){
  var d=DAYS[cur],s=actStats(d),ts=dayTasks(d.n),hasT=d.acts.some(function(a){return a.t});
  var tk=ts.filter(function(t){return S.done[t.id]}).length;
  var ti=tripDayIndex();
  return '<section class="panel d'+d.n+'">'+
   '<div class="dhead"><div class="dnum" aria-hidden="true">'+d.n+'</div>'+
    '<div class="dtxt"><span class="when">'+d.dow+' '+d.date+' de 2026'+(cur===ti?' · hoy':'')+'</span><h2>'+esc(d.title)+'</h2>'+
    '<div class="chips"><span class="chip">'+esc(d.place)+'</span><span class="chip">Punto más alto: '+esc(d.altTxt)+'</span></div></div>'+
    '<div class="dprog"><span>'+s.k+' de '+s.t+' actividades</span><div class="bar"><i style="width:'+Math.round(s.p*100)+'%"></i></div></div></div>'+
   '<div class="note"><b class="ctext">Recomendación</b>'+esc(d.note)+'</div>'+
   '<div class="cols"><div class="sec"><h3>Plan del día <small>marca lo que ya hicieron</small></h3>'+
    d.acts.map(function(a){return actRow(d,a,hasT)}).join("")+'</div>'+
   '<div class="sec">'+(ts.length?'<h3>Por resolver <small>'+tk+' de '+ts.length+'</small></h3>'+ts.map(function(t){return taskRow(t,false)}).join(""):'<h3>Por resolver</h3><p class="hint">Este día no tiene pendientes.</p>')+
    '<h3 style="margin-top:8px">Mis notas</h3><textarea id="notes" data-day="'+d.n+'" placeholder="Hotel, hora del tour, número de contacto, lo que quieras recordar...">'+esc(S.notes["d"+d.n]||"")+'</textarea></div></div>'+
   dayInfo(d.n)+
   '<div class="navrow"><button class="btn" data-go="-1" '+(cur===0?"disabled":"")+'>← Día anterior</button><button class="btn solid" data-go="1" '+(cur===DAYS.length-1?"disabled":"")+'>Día siguiente →</button></div>'+
  '</section>';
}

/* pendientes */
function pendView(){
  var T=totals(),left=T.tt-T.tk;
  var h='<div style="display:flex;flex-direction:column;gap:16px"><div class="tools"><span class="hint">'+(left?'Te faltan <b>'+left+'</b> por resolver.':'¡Todo resuelto!')+'</span>'+
   '<button class="btn" data-hide="1">'+(hideDone?"Mostrar los listos":"Ocultar los listos")+'</button></div><div class="tasks-grid">';
  CATS.forEach(function(c){
    var all=TASKS.filter(function(t){return t.cat===c.k}),k=all.filter(function(t){return S.done[t.id]}).length;
    var show=all.filter(function(t){return !(hideDone&&S.done[t.id])});
    if(!show.length)return;
    h+='<section class="cat d'+c.c+'"><h3><span class="dot"></span>'+c.name+'<small>'+k+' de '+all.length+'</small></h3>'+
       show.map(function(t){return taskRow(t,true)}).join("")+'</section>';
  });
  return h+'</div></div>';
}

/* vuelos */
function legH(a,b,f,t1,t2,c1,c2){
  return '<div class="leg"><div><b>'+t1+'</b><small>'+c1+'</small></div><div class="mid">'+f+'<hr></div><div class="r"><b>'+t2+'</b><small>'+c2+'</small></div></div>';
}
function code(c){return '<button class="code" data-copy="'+c+'" title="Copiar">'+c+'</button>'}
function vueView(){
  return '<div class="blk"><h2 class="sh">Vuelos</h2>'+flightsH()+
   '<h2 class="sh">Alojamiento</h2><div class="info">'+HOTELS.map(stayCard).join("")+'</div>'+
   '<h2 class="sh">Tours</h2><div class="info">'+TOURS.map(tourCard).join("")+'</div></div>';
}
function flightsH(){
  return '<div class="passes">'+
  '<article class="pass d1"><div class="main"><div class="top"><span>Ida · Avianca</span><span>Jue 19 nov</span></div><div class="legs">'+
    legH(0,0,"AV8522","11:00","12:05","CLO · Cali","BOG · Bogotá")+
    '<span class="layover">Escala en Bogotá · 1 h 40 min</span>'+
    legH(0,0,"AV053","13:45","16:50","BOG · Bogotá","LIM · Lima")+
   '</div><div class="foot">Airbus A320 y A320neo · 5 h 50 min en total</div></div>'+
   '<div class="stub"><div><div class="who">Reserva</div>'+code("ATSAGC")+'<div class="cp">Toca para copiar</div></div></div></article>'+
  '<article class="pass d4"><div class="main"><div class="top"><span>Lima a Cusco · JetSMART</span><span>Dom 22 nov</span></div><div class="legs">'+
    legH(0,0,"JA7021","09:35","10:55","LIM · Lima","CUZ · Cusco")+
   '</div><div class="foot">Vuelo directo · 1 h 20 min</div></div>'+
   '<div class="stub"><div><div class="who">Jairo</div>'+code("L3M64Y")+'</div><div><div class="who">Lorena</div>'+code("P7ZG3P")+'</div></div></article>'+
  '<article class="pass d7"><div class="main"><div class="top"><span>Cusco a Lima · JetSMART</span><span>Mié 25 nov</span></div><div class="legs">'+
    legH(0,0,"JA7034","21:30","23:10","CUZ · Cusco","LIM · Lima")+
   '</div><div class="foot">Vuelo directo · traslado al aeropuerto de Cusco a las 20:00</div></div>'+
   '<div class="stub"><div class="who">Duerman en Callao</div></div></article>'+
  '<article class="pass d8"><div class="main"><div class="top"><span>Regreso · Avianca</span><span>Jue 26 nov</span></div><div class="legs">'+
    legH(0,0,"AV050","11:45","15:00","LIM · Lima","BOG · Bogotá")+
    '<span class="layover">Escala en Bogotá · 1 h 45 min</span>'+
    legH(0,0,"AV9201","16:45","17:55","BOG · Bogotá","CLO · Cali")+
   '</div><div class="foot">Airbus A320neo y A320 · 6 h 10 min en total · presentarse a las 8:00 a. m.</div></div>'+
   '<div class="stub"><div><div class="who">Reserva</div>'+code("ATSAGC")+'<div class="cp">Toca para copiar</div></div></div></article>'+
  '</div>';
}

function renderView(){
  var v=$("view"),cs=0,c=$("cord");if(c)cs=c.scrollLeft;
  var ae=document.activeElement,fid=ae&&ae.dataset?ae.dataset.id:null;
  if(tab==="itin")v.innerHTML=cord()+dayPanel();
  else if(tab==="pend")v.innerHTML=pendView();
  else v.innerHTML=vueView();
  c=$("cord");if(c){c.scrollLeft=cs;}
  if(fid){var el=v.querySelector('[data-id="'+fid+'"]');if(el)el.focus({preventScroll:true})}
}
function renderFoot(){
  $("foot").innerHTML='<span>Tus marcas se guardan solas.</span>'+(resetAsk?
   '<span class="confirm"><span>¿Borrar todo el progreso?</span><button class="btn" data-reset="yes">Sí, borrar</button><button class="btn" data-reset="no">Cancelar</button></span>':
   '<button class="reset" data-reset="ask">Reiniciar progreso</button>');
}
function renderAll(){renderHero();renderTabs();renderView();renderFoot()}

/* actions */
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("on")},2200)}
function toggle(id,on){
  var dayIdx=-1,before=false;
  DAYS.forEach(function(d,i){if(d.acts.some(function(a){return a.id===id})){dayIdx=i;before=actStats(d).t===actStats(d).k}});
  if(on)S.done[id]=true;else delete S.done[id];
  justToggled=on?id:null;persist();renderAll();
  if(on&&dayIdx>=0){var s=actStats(DAYS[dayIdx]);
    if(s.k===s.t&&!before){confetti(dayIdx);var T=totals();toast(T.ak===T.at?"¡Viaje completo! Qué aventura":"¡Día "+DAYS[dayIdx].n+" completo!")}}
}
function copy(txt){
  function fb(){var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}ta.remove()}
  try{navigator.clipboard.writeText(txt).then(function(){},fb)}catch(e){fb()}
  toast("Copiado: "+txt);
}
var fxRun=false;
function confetti(i){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  var cv=$("fx"),ctx=cv.getContext("2d"),w=cv.width=innerWidth,h=cv.height=innerHeight;
  var cols=[1,2,3,4,5,7,8].map(function(n){return getComputedStyle(document.documentElement).getPropertyValue("--d"+n).trim()});
  var P=[];for(var k=0;k<140;k++)P.push({x:w/2+(Math.random()-.5)*w*.3,y:h*.55,vx:(Math.random()-.5)*12,vy:-Math.random()*14-4,r:Math.random()*6,s:4+Math.random()*6,c:cols[k%cols.length],a:1});
  var f=0;fxRun=true;
  (function step(){
    ctx.clearRect(0,0,w,h);
    P.forEach(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;p.a=Math.max(0,1-f/90);
      ctx.save();ctx.globalAlpha=p.a;ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.55);ctx.restore()});
    if(++f<95)requestAnimationFrame(step);else ctx.clearRect(0,0,w,h);
  })();
}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-tab],[data-day],[data-go],[data-copy],[data-hide],[data-reset]");if(!el)return;
  if(el.dataset.tab){tab=el.dataset.tab;renderTabs();renderView()}
  else if(el.dataset.day!==undefined){cur=+el.dataset.day;renderView();var c=$("cord"),b=c&&c.children[cur];if(b&&b.scrollIntoView)b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"})}
  else if(el.dataset.go){cur=Math.max(0,Math.min(DAYS.length-1,cur+(+el.dataset.go)));renderView();window.scrollTo({top:$("tabs").offsetTop-8,behavior:"smooth"})}
  else if(el.dataset.copy)copy(el.dataset.copy);
  else if(el.dataset.hide){hideDone=!hideDone;renderView()}
  else if(el.dataset.reset){
    var r=el.dataset.reset;
    if(r==="ask")resetAsk=true;
    else if(r==="no")resetAsk=false;
    else{S={done:{},notes:{},seed:SEED};resetAsk=false;persist();renderAll();toast("Progreso reiniciado");return}
    renderFoot();
  }
});
document.addEventListener("change",function(e){var t=e.target;if(t.matches&&t.matches("input[type=checkbox][data-id]"))toggle(t.dataset.id,t.checked)});
document.addEventListener("input",function(e){var t=e.target;if(t.id==="notes"){var k="d"+t.dataset.day;if(t.value)S.notes[k]=t.value;else delete S.notes[k];persist()}});

var ti0=tripDayIndex();if(ti0>=0)cur=ti0;
renderAll();initDb();
})();
</script>
